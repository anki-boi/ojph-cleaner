name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # One step, same command as the local pre-push hook: JS syntax (js + mjs),
      # the 300-line cap, every node test, package integrity, repo hygiene,
      # README truth, and the personal-path scan. CI and the gate can no
      # longer disagree about whether main is green.
      - name: Gate
        run: sh tools/gate.sh
